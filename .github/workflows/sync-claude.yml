name: Sync Claude Loon rules

'on':
  schedule:
    # 09:17 Singapore time
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: sync-claude-loon-rules
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch GeoSite and regenerate Claude.list
        run: python3 scripts/sync_claude.py

      - name: Commit updated rules
        run: |
          git add -- Claude.list
          if git diff --cached --quiet -- Claude.list; then
            echo 'Claude.list is up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Claude Loon rules' -- Claude.list
          git push origin "HEAD:$GITHUB_REF"
